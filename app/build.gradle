plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Secrets (Maps API key) are kept out of version control in local.properties
// and injected as a manifest placeholder instead of hardcoding them.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.mobdeve.s17.grp2.archerfind'
    compileSdk 34

    defaultConfig {
        applicationId "com.mobdeve.s17.grp2.archerfind"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        manifestPlaceholders["MAPS_API_KEY"] = localProperties.getProperty("MAPS_API_KEY", "")

        buildConfigField "String", "SUPABASE_URL", "\"${localProperties.getProperty('SUPABASE_URL', '')}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${localProperties.getProperty('SUPABASE_ANON_KEY', '')}\""
        buildConfigField "String", "SUPABASE_BUCKET", "\"${localProperties.getProperty('SUPABASE_BUCKET', 'item-photos')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Jetpack Navigation Component
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Explicit version needed for ActivityResultContracts.PickVisualMedia (the system Photo Picker)
    implementation 'androidx.activity:activity:1.9.3'

    // Firebase (Auth, Firestore, Cloud Messaging)
    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    // Required at runtime by firebase-common's heartbeat storage; not pulled in automatically.
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Glide (image loading + display, including blur transform for photo verification)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // OkHttp (used for Supabase Storage REST API upload/download)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // CameraX (in-app photo capture — built-in camera app usage does not satisfy the rubric)
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    // Google Maps + location (location tagging for lost/found items)
    implementation 'com.google.android.gms:play-services-maps:18.0.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
}
